# Skyward 设备配置骨架 — REDMI Turbo 5 Max (dash)
#
# 状态：v3 实测坐实版。全部关键字段来自 24 份真机探测文件（dash_probe/），
#       与官方 OTA / vendor_boot / OrangeFox ramdisk 的静态解包交叉验证。
#
# 数据来源标注：
#   [实测]       = 真机 adb / 官方 OTA 解包 / OrangeFox ramdisk 直接读出并校验
#   [实测-推断]  = 实测值存在，归属/含义由证据链推断，待一条命令复核
#   [推测]       = 按同代机型或 MTK 平台惯例推断
#
# 更新记录
#   v1  2026-11-14  初版：官方 OTA + OrangeFox ramdisk 静态解包
#   v2  2026-11-14  并入真机 adb：完整分区表、vendor_dlkm 模块清单、槽位 _a
#   v3  2026-11-14  并入 dash_probe/ 24 份文件：ready_service 全套坐实（全 AIDL）、
#                   modules.load 全文、density=520、wlan 驱动二选一定案、
#                   解锁状态澄清（伪回锁）、FBE+metadata 加密坐实
#
# ⚠️ 最重要的一条：本机没有独立的 recovery 分区。
#    官方 OTA 的 40 个物理分区不含 recovery；真机 /dev/block/by-name/ 实测确认，
#    只有 vendor_boot_a(sdc38) / vendor_boot_b(sdc73)。
#    recovery 程序位于 vendor_boot 的 vendor ramdisk table（v4 header，
#    entry type=2 RECOVERY, name="recovery"）。因此 [stock] 段在上游 skyward-pack
#    里语义不成立，打包器必须改造，见《适配改造清单.md》。
#    刷入方式：`fastboot flash vendor_boot`（双槽）。
#
# ⚠️ 解锁状态（v3 澄清，重要）：
#    真机 prop 显示 ro.boot.flash.locked=1 / ro.boot.verifiedbootstate=green /
#    ro.boot.vbmeta.device_state=locked / ro.secureboot.lockstate=locked，
#    这是用户做的**伪回锁**（KernelSU root 伪装，context=u:r:ksu:s0）。
#    用户确认真实 BL 已解锁。含义：
#      - fastboot 层面可正常刷写 vendor_boot；
#      - 解锁状态下 bootloader 不强制校验改过的 ramdisk，Skyward 镜像可启动；
#      - 系统内 getprop 读到的 locked 均为伪装，勿据此判断解锁状态；
#      - 复核真实状态用 `fastboot getvar unlocked`（bootloader 模式）。
#
# ⚠️ binder 协议（v3 修正，推翻 v1/v2 的判断）：
#    keymint / gatekeeper / weaver / secure_element / boot 全部是 **AIDL**。
#    三重证据：① /vendor/etc/vintf/manifest/*.xml 里 <hal format="aidl">；
#              ② service list 注册名为点号 AIDL 命名（xxx.IYyy/instance）；
#              ③ lshal 的 "HIDL binderized services" 段为空（本机几乎无 HIDL 服务）。
#    二进制文件名里的 `@3.0`、`@1.2` 只是厂商沿用的历史命名，不代表 HIDL 协议。
#    结论：上游 skyward-programs 的 AIDL binder 绑定路径可直接沿用，
#    v1/v2 里「要为 HIDL 改绑定代码」的改造项撤销，工作量显著下降。

[device]
codename = "dash"
brand = "Redmi"
model = "REDMI Turbo 5 Max"
ab = true                                             # [实测] vendor_boot_a/b、boot_a/b 等成对存在
soc = { hans = "天玑 9500s 移动平台", hant = "天璣 9500s 行動平台", en = "MediaTek Dimensity 9500s (mt6991)" }
os_version_prop = "ro.mi.os.version.incremental"      # [实测] 当前值 OS4.0.4.0.XPLCNXM，与 OTA 包严格一致
# v10 / xaga 移植：本机无独立 recovery 分区，recovery 位于 vendor_boot 的
# RECOVERY ramdisk（v4 header，entry type=2）。见文件顶部第 18-24 行。
recovery_partition = "vendor_boot"
# v10 / xaga 移植：recovery 的 init 不启动 servicemanager，由 Skyward 在
# bring_up() 开头自己起一次；发布服务描述后再重启它会把已注册的 HAL 全冲掉。
restart_service_directory = false
# [实测] 当前活动槽：ro.boot.slot_suffix = _a
# [实测] ro.board.platform=mt6991 / ro.hardware=mt6991 / ro.hardware.gatekeeper=mitee
# [实测] Android 17（SDK 37），fingerprint Redmi/dash/dash:17/CP2A.260605.016/OS4.0.4.0.XPLCNXM:user/release-keys
# [实测] root = KernelSU（su -c id → uid=0 context=u:r:ksu:s0）

[display]
# [实测] wm size: Physical size: 1280x2772；wm density: Physical density: 520；
#        ro.sf.lcd_density=520。⚠️ v1/v2 从 warsaw.toml 沿用的 480 是错的，已改。
width = 1280
height = 2772
density = 520
diagonal = 6.83
corner_radius = 170                                   # [待抓] HyperOS 设置页圆角，仍需实测
# v10 / xaga 移植：面板上电后不切最高刷新率。xaga 的 MTK DRM 在 144Hz 切档
# 会撕裂；dash 同为 MTK DRM，显式关掉，避免引入新的显示变量。
fastest_refresh = false

[modules]
# [实测] 官方 fstab.emmc：vendor_dlkm / odm_dlkm / system_dlkm 均为逻辑分区。
#
# 关键（v5）：sources 里绝不能写 odm_dlkm。skyward 的 source_dir() 对不认识
# 的来源直接 bail!，而 bring_up() 里是 collect::<Result<Vec<_>>>()? ——
# 一个未知来源就让整段设备初始化失败：模块一个都不加载 → 没有 /dev/dri/card0
# → 黑屏。前几版黑屏的直接原因就在这里。本轮已给 source_dir 补上 odm_dlkm
# 支持，但配置仍不写它：dash 的模块全在 vendor_boot 的 platform ramdisk 里。
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
#
# 实测：platform ramdisk 自带 lib/modules/modules.load.recovery（264 行），
# 是原厂 recovery(fastbootd) 的完整加载表，显示链路关键行：
#     98  mtk_panel_ext.ko
#     99  panel-p10u-42-02-0a-dsc-vdo.ko
#    100  panel-p10u-36-02-0b-dsc-vdo.ko
#    104  mediatek-drm.ko        ← /dev/dri/card0 由它建立
#    190  pwm-mtk-disp.ko
#    193  leds-mtk.ko            ← /sys/class/leds/lcd-backlight 由它注册
#
# 关键（v5）：这整张表必须由 skyward 自己加载。OrangeFox 的 init 只 insmod 了
# nxp_i2c / p73 两个，其余 264 个原本由 TWRP 二进制加载。skyward 不加载它们，
# 就既没有 DRM 也没有背光，屏幕永远不亮。
# 本表 = modules.load.recovery 全量 + nxp_i2c/p73（OFX 注入）+ 触摸/振动。
#
# 实测：触摸/振动驱动不在 platform ramdisk，来自 vendor_dlkm：
#   xiaomi_touch_dash.ko → nt38771_touch_dash.ko（依赖，须按此序）
#   si_haptic.ko / fs3002_haptic.ko（两驱动并存，见 [haptics]）
# 打包时已把这 4 个 ko 复制进 platform ramdisk 的 lib/modules/，不依赖分区挂载。
load = [
    "bootprof", "mrdump", "aee_aed", "monitor_hang",
    "mkp", "dbgtop-drm", "irq-dbg", "dbg_error_flag",
    "bus-parity", "last_bus", "mtk_sync", "mtk_disp_notify",
    "log_store", "mtk_printk_ctrl", "nvmem_mtk-devinfo", "mtk_wdt",
    "timer-mediatek", "aee_hangdet", "sec-rng", "device-apc-common",
    "device-apc-mt6991", "mtk-mbox-mailbox", "tinysys-scmi", "ise_lpm",
    "pinctrl-mtk-v2", "pinctrl-mt6991", "smap-mt6991", "mtk-dvfsrc-regulator",
    "mtk-emi", "mtk-dvfsrc", "mtk-scpsys", "mt6991_dcm",
    "mtk_dcm", "clk-common", "clk-fmeter-mt6991", "iommu_debug",
    "smmu_secure", "arm_smmu_v3", "mm-fake-engine", "clk-chk-mt6991",
    "mtk-scpsys-mt6991-spm", "vcp_status_v2", "vcp_v2", "clk-mt6991",
    "clk-mt6991-adsp", "clk-mt6991-cam", "clk-mt6991-img", "clk-mt6991-mmsys",
    "clk-mt6991-peri", "clk-mt6991-mdpsys", "clk-mt6991-bus", "clk-mt6991-vcodec",
